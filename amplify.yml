version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - env | grep -E '^VITE_' > .env.production
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*
